services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-teamdoc}
      POSTGRES_USER: ${DB_USERNAME:-teamdoc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teamdoc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动创建扩展、vector_store 与 HNSW 索引；
      # 全文索引与 RLS（002_fulltext_and_rls.sql）需在应用首次启动建表后手动执行
      - ./backend/src/main/resources/db/postgres/001_vector_store.sql:/docker-entrypoint-initdb.d/001_vector_store.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-teamdoc} -d ${DB_NAME:-teamdoc}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-teamdoc}
      DB_USERNAME: ${DB_USERNAME:-teamdoc}
      DB_PASSWORD: ${DB_PASSWORD:-teamdoc}
      # 必须显式提供强密钥（至少 32 字符）；后端在 postgres Profile 下检测到空/弱密钥将拒绝启动
      JWT_SECRET: ${JWT_SECRET:?请在 .env 或环境中设置 JWT_SECRET（至少32字符）}
      # 纯 HTTP 的 Compose 部署（无 TLS 前置）必须为 false，否则浏览器丢弃 Secure Cookie 导致 15 分钟后被登出；
      # 生产环境若有 HTTPS/TLS 终结（网关/Nginx），请设为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-extractive}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-hashing}
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - files:/app/data/files
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
  files:
