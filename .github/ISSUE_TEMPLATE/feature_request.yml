name: 功能建议 (Feature Request)
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的使用场景与痛点
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望的功能形态；若有参考实现请附上
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能在 PRD 的 MVP 非目标清单内（OCR / 多模态 / 移动端 / 公网搜索等），或属于 P1+ 能力
          required: false
